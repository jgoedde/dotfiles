;
; Material You theme, generated with Matugen
;

[palette]

base=            {{colors.surface_container_high.default.hex}}
text=            {{colors.on_surface.default.hex}}

window=          {{colors.surface.default.hex}}
window_text=     {{colors.on_surface.default.hex}}

button=          {{colors.surface_container.default.hex}}
button_text=     {{colors.on_surface.default.hex}}

highlight=       {{colors.primary.default.hex}}
highlight_text=  {{colors.on_primary.default.hex}}

placeholder_text= {{colors.on_surface_variant.default.hex}}
link=            {{colors.primary.default.hex}}
link_visited=    {{colors.tertiary.default.hex}}

[window]

window_background_brush=  {{colors.surface.default.hex}}
input_background_brush=   {{colors.surface_container_high.default.hex}}
input_trigger_color=      {{colors.primary.default.hex}}
input_hint_color=         {{colors.on_surface_variant.default.hex}}
settings_button_color=            {{colors.on_surface_variant.default.hex}}
settings_button_highlight_color=  {{colors.primary.default.hex}}

; M3 selected list items use a tonal "secondary container", not solid primary
result_item_selection_background_brush=  {{colors.secondary_container.default.hex}}
result_item_selection_text_color=        {{colors.on_secondary_container.default.hex}}
result_item_selection_subtext_color=     {{colors.on_secondary_container.default.hex}}
result_item_text_color=     {{colors.on_surface.default.hex}}
result_item_subtext_color=  {{colors.on_surface_variant.default.hex}}

action_item_selection_background_brush=  {{colors.secondary_container.default.hex}}
action_item_selection_text_color=        {{colors.on_secondary_container.default.hex}}
action_item_text_color=                  {{colors.on_surface.default.hex}}
